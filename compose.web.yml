services:
  hki7-web:
    image: ghcr.io/pissten/hki7-web:multiplatform-web
    container_name: hki7-web
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
