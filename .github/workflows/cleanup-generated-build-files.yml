name: Clean generated build files

on:
  push:
    branches:
      - multiplatform-web
    paths:
      - ".github/workflows/cleanup-generated-build-files.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: hki7-generated-build-cleanup
  cancel-in-progress: false

jobs:
  clean-and-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: multiplatform-web
          fetch-depth: 0

      - name: Remove generated build outputs from Git history
        shell: bash
        run: |
          git rm -r --ignore-unmatch sharedUi/build webApp/build
          if ! grep -qxF '**/build/' .gitignore; then
            printf '\n# Generated outputs for every Gradle module\n**/build/\n' >> .gitignore
          fi
          git rm .github/workflows/cleanup-generated-build-files.yml

      - name: Commit clean source tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove generated Gradle build outputs"
          git push origin HEAD:multiplatform-web

      - name: Build and publish clean preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/327254168/dispatches" \
            -f ref=multiplatform-web
