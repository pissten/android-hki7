name: Copy HKI 7 strings to Compose resources

on:
  push:
    branches:
      - multiplatform-web
    paths:
      - "tools/copy_strings_to_compose_resources.py"
      - ".github/workflows/copy-compose-strings.yml"
  pull_request:
    branches:
      - main
    paths:
      - "tools/copy_strings_to_compose_resources.py"
      - ".github/workflows/copy-compose-strings.yml"

permissions:
  contents: write

concurrency:
  group: hki7-compose-string-copy
  cancel-in-progress: true

jobs:
  copy:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: multiplatform-web
          fetch-depth: 0
      - name: Copy Android translations into shared Compose resources
        run: python3 tools/copy_strings_to_compose_resources.py
      - name: Commit shared resources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sharedUi/src/commonMain/composeResources
          git diff --cached --quiet && exit 0
          git commit -m "refactor(kmp): share HKI 7 string resources"
          git push origin HEAD:multiplatform-web
