name: Build HKI 7 Web

on:
  workflow_dispatch:
  push:
    branches:
      - multiplatform-web
    paths:
      - "webApp/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/build-web.yml"

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK for root-project configuration
        uses: android-actions/setup-android@v3

      - name: Install Android preview SDK used by the existing app module
        run: |
          sdkmanager --channel=3 \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0"

      - name: Build production WebAssembly distribution
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :webApp:wasmJsBrowserDistribution

      - name: Upload web distribution
        uses: actions/upload-artifact@v4
        with:
          name: HKI7-web-wasm
          path: webApp/build/dist/wasmJs/productionExecutable
          if-no-files-found: error
          retention-days: 30
