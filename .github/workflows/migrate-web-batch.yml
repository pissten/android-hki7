name: Migrate HKI 7 shared UI batch

on:
  workflow_dispatch:
  push:
    branches:
      - multiplatform-web
    paths:
      - "tools/multiplatform/migrate_batch.py"
      - "tools/multiplatform/migrate_room_visuals.py"
      - "tools/multiplatform/wire_shared_area_card.py"
      - ".github/workflows/migrate-web-batch.yml"

permissions:
  contents: write

concurrency:
  group: hki7-shared-ui-migration
  cancel-in-progress: true

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: multiplatform-web
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android preview SDK
        shell: bash
        run: |
          sdkmanager_path="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager_path" ]; then
            sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -111 | head -n 1)"
          fi
          test -n "$sdkmanager_path" && test -x "$sdkmanager_path"
          "$sdkmanager_path" --channel=3 \
            "platforms;android-37.0" \
            "build-tools;37.0.0"

      - name: Apply deterministic migration batch
        run: |
          python3 tools/multiplatform/migrate_batch.py
          python3 tools/multiplatform/migrate_room_visuals.py
          python3 tools/multiplatform/wire_shared_area_card.py

      - name: Show migration diff
        run: git status --short && git diff --stat && git diff --check

      - name: Compile Wasm and assemble Android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            :webApp:compileKotlinWasmJs \
            :app:assembleDebug

      - name: Commit validated migration
        shell: bash
        run: |
          if git status --porcelain | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "refactor(shared): migrate validated HKI7 UI batch"
            git push origin HEAD:multiplatform-web
          else
            echo "Migration batch is already applied."
          fi
