name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - multi-os
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 17 preview SDK
        run: |
          sdkmanager --channel=3 \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0"

      - name: Read app version
        id: version
        run: |
          NAME=$(python3 - <<'PY'
          import re, pathlib
          text = pathlib.Path("app/build.gradle.kts").read_text()
          match = re.search(r'versionName\s*=\s*"([^"]+)"', text)
          print(match.group(1) if match else "dev")
          PY
          )
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "App version: $NAME"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Prepare release file
        run: |
          mkdir -p release
          VERSION="${{ steps.version.outputs.name }}"
          BRANCH="${GITHUB_REF_NAME}"
          cp app/build/outputs/apk/debug/app-debug.apk \
            "release/HKI7-${VERSION}-${BRANCH}-build-${GITHUB_RUN_NUMBER}.apk"
          ls -la release

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: HKI7-debug-apk
          path: release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hki7-ci-${{ github.run_number }}
          name: HKI7 ${{ steps.version.outputs.name }} CI ${{ github.run_number }} (${{ github.ref_name }})
          prerelease: true
          generate_release_notes: true
          body: |
            Automated installable debug APK from `${{ github.ref_name }}` at `${{ github.sha }}`.

            Version: **${{ steps.version.outputs.name }}**
            Requires Android 12 or newer (minSdk 31). Signed with the standard Android debug key for testing.
          files: release/*.apk
          fail_on_unmatched_files: true
