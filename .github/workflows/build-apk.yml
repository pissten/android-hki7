name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - t500-android12-compat
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 17 preview SDK
        run: |
          sdkmanager --channel=3 \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Prepare release file
        run: |
          mkdir -p release
          if [ "${GITHUB_REF_NAME}" = "t500-android12-compat" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk "release/HKI7-1.0.0-beta.9-T500-Android12-Orientation1-build-${GITHUB_RUN_NUMBER}.apk"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "release/HKI7-1.0.0-beta.9-debug-build-${GITHUB_RUN_NUMBER}.apk"
          fi

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: HKI7-${{ github.ref_name }}-apk
          path: release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hki7-${{ github.ref_name }}-ci-${{ github.run_number }}
          name: HKI7 ${{ github.ref_name }} Build ${{ github.run_number }}
          prerelease: true
          body: |
            Automated installable debug APK built from branch `${{ github.ref_name }}` and commit `${{ github.sha }}`.

            T500 compatibility build identification:
            - Version: `1.0.0-beta.9-t500-orientation.1`
            - Version code: `17`
            - Android 12 / API 31 minimum
            - Settings > Appearance includes Portrait, Landscape, and Auto-rotate

            This compatibility build is experimental because the upstream app officially requires Android 14 or newer.
          files: release/*.apk
          fail_on_unmatched_files: true
