name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 17 preview SDK
        run: |
          sdkmanager --channel=3 \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Prepare release file
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/HKI7-1.0.0-beta.9-debug-build-${GITHUB_RUN_NUMBER}.apk"

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: HKI7-debug-apk
          path: release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hki7-ci-${{ github.run_number }}
          name: HKI7 CI Build ${{ github.run_number }}
          prerelease: true
          body: |
            Automated installable debug APK built from commit `${{ github.sha }}`.

            Requires Android 14 or newer. This APK is signed with the standard Android debug key and is intended for testing.
          files: release/*.apk
          fail_on_unmatched_files: true
