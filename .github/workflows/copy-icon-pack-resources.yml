name: Copy HKI 7 icon pack resources

on:
  push:
    branches:
      - multiplatform-web
    paths:
      - "tools/copy_icon_pack_resources_to_shared.py"
      - ".github/workflows/copy-icon-pack-resources.yml"
  pull_request:
    branches:
      - main
    paths:
      - "tools/copy_icon_pack_resources_to_shared.py"
      - ".github/workflows/copy-icon-pack-resources.yml"

permissions:
  contents: write

concurrency:
  group: hki7-icon-resource-migration
  cancel-in-progress: true

jobs:
  copy:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: multiplatform-web
          fetch-depth: 0
      - name: Copy existing bundled icon resources into sharedUi
        run: python3 tools/copy_icon_pack_resources_to_shared.py
      - name: Commit shared icon resources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sharedUi/src/commonMain/composeResources
          git diff --cached --quiet && exit 0
          git commit -m "refactor(kmp): share bundled HKI 7 icon resources"
          git push origin HEAD:multiplatform-web
